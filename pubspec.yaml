name: fark_noi
description: Flutter Android App - Clean Architecture Skeleton
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2

  # State Management
  mobx: ^2.3.3
  flutter_mobx: ^2.2.1
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4

  # Network
  dio: ^5.3.3
  pretty_dio_logger: ^1.3.1

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^12.1.1

  # Location — GET /trips/nearby is measured from the caller's coordinate.
  #
  # geolocator_android is pinned below 4.6.2: from that version its Gradle
  # script reads `flutter.compileSdkVersion`, an extension the Flutter tool
  # installs on `:app` only from 3.27 onwards. On the 3.24.5 this project is
  # fvm-pinned to, the plugin's own module cannot see it and Gradle refuses the
  # build with "unknown property 'flutter'". 4.5.5 states its levels itself.
  geolocator: ^13.0.1

  # Utils
  dartz: ^0.10.1
  intl: ^0.18.1
  logger: ^2.0.2+1

  # Media — receipt / delivery-proof photos (POST /media/upload-sessions) and
  # the PromptPay QR every payment screen draws.
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0

dependency_overrides:
  geolocator_android: 4.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.7
  mobx_codegen: ^2.6.1
  mocktail: ^1.0.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Anuphan — the same Thai/Latin face the web app ships (frontend/public/font).
  # One family, five weights: 300/400/500/600/700 map to the design system's
  # light / regular / medium / semibold / bold steps.
  fonts:
    - family: Anuphan
      fonts:
        - asset: assets/fonts/Anuphan-Light.ttf
          weight: 300
        - asset: assets/fonts/Anuphan-Regular.ttf
          weight: 400
        - asset: assets/fonts/Anuphan-Medium.ttf
          weight: 500
        - asset: assets/fonts/Anuphan-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Anuphan-Bold.ttf
          weight: 700
