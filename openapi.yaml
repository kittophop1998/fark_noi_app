    StartPurchasingRequest: { $ref: '#/components/schemas/ArrivalLocation' }
    ArrivalLocation:
      type: object
      required: [latitude, longitude]
      description: >-
        Where the runner's own device says it is, at the moment they pressed the
        button. It is the only part of the arrival check the client is trusted
        for: the coordinate it is measured against is read off the order, and a
        store or delivery coordinate sent by a client is ignored everywhere.

        Both steps this appears on are refused unless the distance to the
        order's own coordinate is within the configured arrival radius (a
        distance exactly equal to it passes) — see TOO_FAR_FROM_STORE and
        TOO_FAR_FROM_DELIVERY_POINT, whose details carry the radius in force.
        A refusal leaves the order's status untouched.

        The radius is arrival.radiusMeters in the app settings, set by an
        administrator; TRIP_ARRIVAL_RADIUS_METERS (10) is the default an
        installation runs on until one is saved. It is not published on
        GET /app-settings: a client is told the figure when it is refused, and
        is not told it in advance.
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        accuracy:
          type: number
          format: double
          minimum: 0
          description: >-
            The device's own error bar in metres — position.coords.accuracy in a
            browser. Optional, and sent whenever the device offers it: it is
            kept with the arrival record and screens out a fix too vague to place
            anybody (LOCATION_ACCURACY_TOO_LOW, above
            MAX_ALLOWED_GPS_ACCURACY_METERS). It never substitutes for the
            distance rule.
    ProofMediaIDs: { type: array, minItems: 1, maxItems: 5, description: 'Confirmed ORDER_PROOF uploads owned by the runner. Refused with ORDER_PROOF_INVALID otherwise; ORDER_PROOF_REQUIRED / ORDER_PROOF_TOO_MANY / ORDER_PROOF_DUPLICATE cover the shape.', items: {type: string, format: objectid} }
