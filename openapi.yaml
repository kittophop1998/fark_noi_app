    TripPricingRequest: { type: object, description: 'Who names the ค่ารับฝาก on this trip. Omitted entirely by a client that predates traveller-defined pricing, which is REQUESTER_OFFER — the arrangement every trip was opened under until now. Under REQUESTER_OFFER the three traveller fields are ignored rather than refused, and are not stored. Amounts are satang, and the server re-validates every combination: TRAVELER_DEFINED requires a type, FLAT requires flatFee > 0, PER_ITEM requires pricePerItem > 0. Anything else is 422 TRIP_PRICING_INVALID.', properties: { mode: {type: string, enum: [REQUESTER_OFFER, TRAVELER_DEFINED], default: REQUESTER_OFFER}, type: {type: string, enum: [FLAT, PER_ITEM], description: 'Required under TRAVELER_DEFINED, meaningless otherwise'}, flatFee: {type: integer, format: int64, minimum: 1, description: 'The whole fee for one order, in satang. FLAT only.'}, pricePerItem: {type: integer, format: int64, minimum: 1, description: 'The fee per piece, in satang, multiplied by the order''s total item quantity. PER_ITEM only.'} } }
    TripPricing: { type: object, required: [mode], description: 'A trip''s published ค่ารับฝาก terms. Always sent, including on a trip stored before this existed — an absent stored mode is resolved to REQUESTER_OFFER rather than left for a client to interpret. type, flatFee and pricePerItem appear only under TRAVELER_DEFINED: a REQUESTER_OFFER trip has no rate to publish, and a zero would read as "free" on the screen drawing it.', properties: { mode: {type: string, enum: [REQUESTER_OFFER, TRAVELER_DEFINED]}, type: {type: string, enum: [FLAT, PER_ITEM]}, flatFee: {type: integer, format: int64, description: Satang}, pricePerItem: {type: integer, format: int64, description: Satang} } }
    OrderPricing: { type: object, required: [mode], description: 'The trip''s ค่ารับฝาก terms frozen onto one order at creation, so a traveller who re-prices their trip cannot change what an errand already agreed was agreed at. Absent means the requester named the figure themselves — every order placed before traveller-defined pricing existed, and every one placed on a trip that still lets them. rewardAmount on the order is the amount; this is the working behind it.', properties: { mode: {type: string, enum: [REQUESTER_OFFER, TRAVELER_DEFINED]}, type: {type: string, enum: [FLAT, PER_ITEM]}, flatFee: {type: integer, format: int64, description: Satang}, pricePerItem: {type: integer, format: int64, description: Satang}, totalQuantity: {type: integer, description: 'The pieces the per-piece rate was multiplied by, summed from the order''s own item snapshot. PER_ITEM only.'} } }
